<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>متجري الإلكتروني</h1>
        <div class="cart-btn" onclick="toggleCart()">🛒 سلة المشتريات (<span id="cart-count">0</span>)</div>
    </header>

    <nav class="categories">
        <button onclick="filterProducts('all')">الكل</button>
        <button onclick="filterProducts('electronics')">إلكترونيات</button>
        <button onclick="filterProducts('clothes')">ملابس</button>
    </nav>

    <main class="product-grid" id="product-grid">
        </main>

    <div id="cart-modal" class="cart-modal hidden">
        <h2>سلة الطلبات</h2>
        <div id="cart-items"></div>
        <p>الإجمالي: <span id="total-price">0</span> جنيه</p>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()">إرسال الطلب عبر واتساب 📱</button>
        <button onclick="toggleCart()">إغلاق</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
